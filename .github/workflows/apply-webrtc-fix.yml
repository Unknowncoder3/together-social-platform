name: Apply one-time WebRTC fix

on:
  push:
    paths:
      - '.github/workflows/apply-webrtc-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch main.jsx
        run: |
          echo ''
          | base64 -d > /tmp/apply_fix.py
          python3 /tmp/apply_fix.py
          node --check client/src/main.jsx

      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/main.jsx
          git rm .github/workflows/apply-webrtc-fix.yml
          git commit -m 'fix shared room WebRTC negotiation'
          git push
