name: Apply WebRTC and Couple Video Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix-webrtc-and-couple-video.py
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js client/src/couple-widget.js
          git rm scripts/fix-webrtc-and-couple-video.py .github/workflows/apply-webrtc-couple-fix.yml
          git commit -m "fix room peer discovery and persistent couple video"
          git push
