name: Fix Couple Incoming Requests

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch couple request UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('client/src/couple-widget.js')
          text = path.read_text()
          start = text.index('const renderConnect=()=>{')
          end = text.index('const renderHome=()=>{', start)

          new = r'''const renderConnect=()=>{const incoming=state?.incoming||[];const outgoing=state?.outgoing||[];body.innerHTML=`<div class="coupleLanding"><div class="coupleOrb">❤️</div><h3>Your private space starts with one person.</h3><p>Choose the person you want to build this experience with. Once connected, the relationship gets one permanent private room that both partners enter — it is not a separate room for each person.</p><button class="couplePrimary" data-action="find">Find your partner</button></div>${incoming.length?`<div class="bondingGate"><h3>💌 Couple request waiting</h3><p class="coupleMeta">Someone wants to connect with you as a partner.</p>${incoming.map(r=>`<div class="listItem"><span><b>${esc(r.user?.name||'Someone')}</b><small>${esc(r.user?.email||'')}</small></span><div style="display:flex;gap:8px"><button class="couplePrimary" data-accept="${r.id}">Accept ❤️</button><button class="coupleSubtle" data-reject="${r.id}">Decline</button></div></div>`).join('')}</div>`:''}${outgoing.length?`<div class="roomInfo">⏳ Waiting for ${esc(outgoing[0]?.user?.name||'them')} to accept your couple request.</div>`:''}<div id="coupleConnectBox"></div>`;panel.querySelector('[data-action="find"]').onclick=()=>{panel.querySelector('#coupleConnectBox').innerHTML=`<div class="bondingGate"><h3>💌 Find your person</h3><div style="display:flex;gap:8px;margin-top:12px"><input id="partnerSearch" style="flex:1;background:#0f0d13;color:#fff;border:1px solid #403441;border-radius:10px;padding:11px" placeholder="Name or email…"/><button class="couplePrimary" id="partnerSearchBtn">Search</button></div><div id="partnerResults"></div></div>`;panel.querySelector('#partnerSearchBtn').onclick=async()=>{const q=panel.querySelector('#partnerSearch').value.trim();if(!q)return;const box=panel.querySelector('#partnerResults');box.innerHTML='<p class="coupleMeta">Searching…</p>';try{const users=await api('/api/users/search?q='+encodeURIComponent(q));box.innerHTML=users.length?users.map(u=>`<div class="listItem"><span><b>${esc(u.name)}</b><small>${esc(u.email)}</small></span><button class="couplePrimary" data-pick="${u.id}">Choose ❤️</button></div>`).join(''):'<p class="coupleMeta">No users found.</p>';panel.querySelectorAll('[data-pick]').forEach(b=>b.onclick=async()=>{try{await api('/api/couple/request/'+b.dataset.pick,{method:'POST'});await render()}catch(e){alert(e.message);state=await api('/api/couple').catch(()=>state);render()}})}catch(e){box.innerHTML=`<div class="roomInfo error">${esc(e.message)}</div>`}}};};panel.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{try{await api('/api/couple/request/'+b.dataset.accept+'/accept',{method:'POST'});await render()}catch(e){alert(e.message)}});panel.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{try{await api('/api/couple/request/'+b.dataset.reject+'/reject',{method:'POST'});await render()}catch(e){alert(e.message)}})};
'''

          path.write_text(text[:start] + new + text[end:])
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/couple-widget.js
          git rm .github/workflows/fix-couple-incoming.yml
          git commit -m "fix incoming couple request UI"
          git push
