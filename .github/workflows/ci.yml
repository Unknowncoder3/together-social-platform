name: Together CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build

  python-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r ml/requirements.txt
      - run: python ml/dataset/generate_dataset.py
      - run: python ml/training/train_scene_model.py
      - run: python ml/training/train_activity_model.py
      - run: python ml/training/build_question_engine.py
