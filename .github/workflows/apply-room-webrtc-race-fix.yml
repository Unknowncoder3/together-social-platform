name: Apply room WebRTC race fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply patch
        run: python scripts/fix-room-webrtc-race.py

      - name: Commit patch if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/main.jsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix normal room WebRTC listener race"
          git push

      - name: Remove one-shot patch files
        if: always()
        run: |
          git rm -f scripts/fix-room-webrtc-race.py .github/workflows/apply-room-webrtc-race-fix.yml || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "remove temporary WebRTC patch workflow"
            git push
          fi
