name: Apply one-time WebRTC fix

on:
  push:
    paths:
      - 'scripts/apply_webrtc_fix.py'
      - '.github/workflows/apply-webrtc-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.jsx
        run: python3 scripts/apply_webrtc_fix.py
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/main.jsx
          git rm .github/workflows/apply-webrtc-fix.yml scripts/apply_webrtc_fix.py
          git commit -m 'fix shared room WebRTC negotiation'
          git push
