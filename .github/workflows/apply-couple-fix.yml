name: Apply Couple Request Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix_couple_requests.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/couple-widget.js
          git rm scripts/fix_couple_requests.py .github/workflows/apply-couple-fix.yml
          git commit -m "fix incoming couple request UI"
          git push
